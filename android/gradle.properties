org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ─────────────────────────────────────────────────────────────────
# 签名配置（v0.5.0 起使用项目自带的正式 keystore，不再依赖 debug 证书）
# keystore 文件：android/keystore/mobilecode-release.jks（随仓库分发，
# 便于任何人从源码构建出可安装/可覆盖升级的 APK）。
# 若需更换为自己的签名，把下面四项改为你的配置或用环境变量覆盖。
# ─────────────────────────────────────────────────────────────────
MOBILECODE_STORE_FILE=keystore/mobilecode-release.jks
MOBILECODE_STORE_PASSWORD=mobilecode2026
MOBILECODE_KEY_ALIAS=mobilecode
MOBILECODE_KEY_PASSWORD=mobilecode2026

# 提示：
# - JDK 版本要求 17（AGP 8.7 / Kotlin 2.1 不支持 JDK 21+）。
#   如本机默认 JDK 不是 17，可取消下一行注释并指向你的 JDK 17：
# org.gradle.java.home=/path/to/jdk-17
